<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="食光默认封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf1e4"/>
      <stop offset="1" stop-color="#edd9bf"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4653a"/>
      <stop offset="1" stop-color="#a8401c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <circle cx="640" cy="120" r="70" fill="#e8c9a5" opacity="0.55"/>
  <circle cx="150" cy="480" r="110" fill="#e8c9a5" opacity="0.35"/>

  <!-- 碗 -->
  <path d="M250 330h300a150 150 0 0 1-300 0z" fill="url(#bowl)"/>
  <ellipse cx="400" cy="330" rx="150" ry="26" fill="#f7e6cf" opacity="0.9"/>
  <ellipse cx="400" cy="330" rx="120" ry="16" fill="#f0c9a0"/>

  <!-- 热气 -->
  <g fill="none" stroke="#c2410c" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round">
    <path d="M340 270c-18-26 16-42 0-68"/>
    <path d="M400 262c-20-30 18-48 0-78"/>
    <path d="M460 270c-18-26 16-42 0-68"/>
  </g>

  <!-- 筷子 -->
  <g stroke="#8a6b45" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="540" y1="250" x2="660" y2="360"/>
    <line x1="566" y1="228" x2="672" y2="330"/>
  </g>

  <text x="400" y="500" text-anchor="middle" font-family="Songti SC, STSong, serif" font-size="44" fill="#a8401c" letter-spacing="10">食光</text>
  <text x="400" y="538" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#b08a63" letter-spacing="4">厨友作品 · 暂无成品图</text>
</svg>
